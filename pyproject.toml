[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dopplergeo"
version = "0.3.0"
description = "Acoustic aircraft Doppler geolocation of operator-owned recordings against ADS-B tracks"
requires-python = ">=3.12"

[project.scripts]
dopplergeo = "dopplergeo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dopplergeo = ["web/templates/*.html", "web/static/*", "web/static/vendor/*", "web/static/vendor/leaflet/*",
              "web/static/vendor/leaflet/images/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
